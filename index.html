<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>MiniOChem</title>
  <meta name="description" content="Interactive organic chemistry structure visualizer.">
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #fffdf8;
    }
  </style>
</head>
<body>
  <mini-ochem id="ochem"></mini-ochem>

  <script type="module" src="./miniochem.js"></script>
  <script type="module">
    const app = document.querySelector("#ochem");
    const params = new URLSearchParams(location.search);

    const query =
      params.get("q") ||
      params.get("molecule") ||
      params.get("formula");

    const view = params.get("view");

    if (query) app.setAttribute("molecule", query);
    if (view) app.setAttribute("view", view);

    app.addEventListener("moleculechange", (event) => {
      const url = new URL(location.href);
      url.searchParams.delete("formula");
      url.searchParams.delete("molecule");
      url.searchParams.set("q", event.detail.query);
      url.searchParams.set("view", app.getAttribute("view") || "skeletal");
      history.replaceState(null, "", url);
    });

    app.addEventListener("querychange", (event) => {
      const url = new URL(location.href);
      url.searchParams.delete("formula"); url.searchParams.delete("molecule");
      url.searchParams.set("q", event.detail.query);
      history.replaceState(null, "", url);
    });

    app.addEventListener("viewchange", (event) => {
      const url = new URL(location.href);
      url.searchParams.set("view", event.detail.view);
      history.replaceState(null, "", url);
    });
  </script>
</body>
</html>
